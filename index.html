<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Static Website</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f6f8fa;
        color: #24292f;
      }

      main {
        text-align: center;
        padding: 2rem;
      }

      h1 {
        margin-bottom: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Welcome to my static website</h1>
      <p>This site is ready to be deployed with GitHub Pages.</p>
    </main>
  </body>
</html>
